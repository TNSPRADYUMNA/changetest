name: Verify
on: [push, pull_request]
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python benchmark.py
      - run: python -m pytest -q
      - name: Verify Neo4j graph export
        run: |
          docker run -d --rm --name graph -p 127.0.0.1:7687:7687 -e NEO4J_AUTH=neo4j/local_change_test neo4j:5
          for attempt in {1..30}; do
            if docker exec graph cypher-shell -u neo4j -p local_change_test 'RETURN 1' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          NEO4J_URI=bolt://127.0.0.1:7687 NEO4J_USER=neo4j NEO4J_PASSWORD=local_change_test python neo4j_export.py . --project verify
          python - <<'PY'
          from neo4j import GraphDatabase
          with GraphDatabase.driver("bolt://127.0.0.1:7687", auth=("neo4j", "local_change_test")) as driver:
              records, _, _ = driver.execute_query(
                  "MATCH (:ChangeNode {project:$project})-[r:DEPENDS]->(:ChangeNode) RETURN count(r) AS edges",
                  project="verify",
              )
              assert records[0]["edges"] > 0, "No dependencies persisted"
              print(f"Verified {records[0]['edges']} Neo4j relationships")
          PY
